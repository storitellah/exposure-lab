<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Tatu Exposure Lab by Storitellah — three controls, one creative decision. Learn aperture, shutter speed and ISO with an interactive camera simulator." />
    <meta name="theme-color" content="#171717" />
    <meta property="og:title" content="Tatu Exposure Lab by Storitellah" />
    <meta property="og:description" content="Three controls. One creative decision. An interactive exposure triangle simulator for young photographers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/og-card.svg" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tatu Exposure Lab by Storitellah</title>
  </head>
  <body>
    <!--
      Static boot content. React replaces it as soon as the app mounts, so if
      it is still on screen something failed to load — a blank page tells the
      user nothing, this tells them what to try. No inline script is used, to
      keep the strict Content-Security-Policy intact.
    -->
    <div id="root">
      <div class="boot-fallback">
        <h1>Tatu Exposure Lab</h1>
        <p>Three controls. One creative decision.</p>
        <p class="boot-hint">
          Loading the simulator… If this message stays on screen, the app
          files could not be loaded. Try reloading the page, or check your
          connection.
        </p>
        <noscript>
          <strong>This simulator needs JavaScript.</strong>
          Please enable JavaScript for this site and reload the page.
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
